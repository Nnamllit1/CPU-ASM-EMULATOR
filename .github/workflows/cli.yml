# Disclaimer:
# This workflow was created with help from an AI agent because the maintainer
# chose the sensible lazy route instead of hand-rolling YAML by candlelight.

name: CLI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows Build and Smoke Test
    runs-on: windows-latest

    env:
      CONFIGURATION: ReleaseSize
      PLATFORM: x64
      EXE_PATH: x64\ReleaseSize\CPU-ASM-EMULATOR.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: pwsh
        run: >
          msbuild CPU-ASM-EMULATOR.slnx
          /p:Configuration=${{ env.CONFIGURATION }}
          /p:Platform=${{ env.PLATFORM }}
          /p:PlatformToolset=v143
          /m

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $PWD "${{ env.EXE_PATH }}"

          if (-not (Test-Path $exe)) {
            throw "Executable was not built: $exe"
          }

          $help = & $exe --help
          if ($LASTEXITCODE -ne 0 -or ($help -join "`n") -notmatch "Usage: CPU-ASM-EMULATOR") {
            throw "--help did not print the expected usage text."
          }

          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or ($version -join "`n") -notmatch "CPU-ASM-EMULATOR version") {
            throw "--version did not print the expected version text."
          }

          $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) ("cpu-asm-emulator-" + [System.Guid]::NewGuid())
          New-Item -ItemType Directory -Path $tempDir | Out-Null

          try {
            $asmPath = Join-Path $tempDir "hello.asm"
            @(
              "start:",
              "    %putc r0 72",
              "    %putc r0 105",
              "    %newline r0",
              "    hlt"
            ) | Set-Content -Path $asmPath -Encoding ascii

            $outbin = & $exe --asm $asmPath --outbin
            if ($LASTEXITCODE -ne 0) {
              throw "Assembler returned exit code $LASTEXITCODE."
            }

            $binaryLines = @($outbin | Where-Object { $_ -match "^[0-9A-F]{4}: [01]{8}$" })
            if ($binaryLines.Count -ne 56) {
              Write-Host "Assembler output:"
              Write-Host ($outbin -join "`n")
              throw "Expected 56 encoded bytes from 7 macro-expanded instructions, got $($binaryLines.Count)."
            }

            $expectedFirstInstruction = @(
              "0000: 00000000",
              "0001: 00000000",
              "0002: 00000000",
              "0003: 00000000",
              "0004: 00000000",
              "0005: 00000000",
              "0006: 00000000",
              "0007: 01001000"
            )

            $actualFirstInstruction = @($binaryLines | Select-Object -First 8)
            if (($actualFirstInstruction -join "`n") -ne ($expectedFirstInstruction -join "`n")) {
              Write-Host "Assembler output:"
              Write-Host ($outbin -join "`n")
              throw "First instruction was not 'movi r0, 72'."
            }

            $run = & $exe --asm $asmPath --emulate
            if ($LASTEXITCODE -ne 0) {
              throw "Emulator returned exit code $LASTEXITCODE."
            }

            if (($run -join "`n") -notmatch "Hi") {
              throw "Emulator output did not contain the expected text."
            }

            $echoAsmPath = Join-Path $tempDir "echo.asm"
            @(
              "start:",
              "    movi r0, 0",
              "wait_input:",
              "    in r0",
              "    jz r0, wait_input",
              "    out r0",
              "    hlt"
            ) | Set-Content -Path $echoAsmPath -Encoding ascii

            $echoRun = "Z" | & $exe --asm $echoAsmPath --emulate
            if ($LASTEXITCODE -ne 0) {
              throw "Input emulator returned exit code $LASTEXITCODE."
            }

            if (($echoRun -join "`n") -notmatch "Z") {
              throw "Input instruction did not echo the expected character."
            }

            $keyAsmPath = Join-Path $tempDir "key.asm"
            @(
              "start:",
              "    movi r0, 0",
              "wait_key:",
              "    inkey r0",
              "    jz r0, wait_key",
              "    out r0",
              "    hlt"
            ) | Set-Content -Path $keyAsmPath -Encoding ascii

            $keyRun = "K" | & $exe --asm $keyAsmPath --emulate
            if ($LASTEXITCODE -ne 0) {
              throw "Input key emulator returned exit code $LASTEXITCODE."
            }

            if (($keyRun -join "`n") -notmatch "K") {
              throw "Input key instruction did not echo the expected character."
            }

            $noInputAsmPath = Join-Path $tempDir "no-input.asm"
            @(
              "start:",
              "    movi r0, 'A'",
              "    in r0",
              "    out r0",
              "    hlt"
            ) | Set-Content -Path $noInputAsmPath -Encoding ascii

            $noInputRun = & $exe --asm $noInputAsmPath --emulate
            if ($LASTEXITCODE -ne 0) {
              throw "No-input emulator returned exit code $LASTEXITCODE."
            }

            if (($noInputRun -join "`n") -notmatch "A") {
              throw "Input instruction changed the register even though no input was available."
            }

            $romPath = Join-Path $tempDir "hello.rom"
            & $exe --asm $asmPath --bin $romPath
            if ($LASTEXITCODE -ne 0) {
              throw "Binary writer returned exit code $LASTEXITCODE."
            }

            $romBytes = [System.IO.File]::ReadAllBytes($romPath)
            if ($romBytes.Length -ne 56) {
              throw "Expected binary ROM to contain 56 bytes, got $($romBytes.Length)."
            }

            if ($romBytes[7] -ne 72) {
              throw "Binary ROM first instruction was not 'movi r0, 72'."
            }

            $romRun = & $exe --rom $romPath --emulate
            if ($LASTEXITCODE -ne 0) {
              throw "ROM loader returned exit code $LASTEXITCODE."
            }

            if (($romRun -join "`n") -notmatch "Hi") {
              throw "Direct ROM emulation did not contain the expected text."
            }
          }
          finally {
            Remove-Item -LiteralPath $tempDir -Recurse -Force
          }

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -LiteralPath "${{ env.EXE_PATH }}" -Destination "dist\CPU-ASM-EMULATOR.exe"
          Compress-Archive -Path "dist\CPU-ASM-EMULATOR.exe" -DestinationPath "dist\CPU-ASM-EMULATOR-windows-x64.zip" -Force

          choco install upx -y --no-progress
          Copy-Item -LiteralPath "${{ env.EXE_PATH }}" -Destination "dist\CPU-ASM-EMULATOR-upx.exe"
          upx --best --lzma "dist\CPU-ASM-EMULATOR-upx.exe"

          $packedVersion = & "dist\CPU-ASM-EMULATOR-upx.exe" --version
          if ($LASTEXITCODE -ne 0 -or ($packedVersion -join "`n") -notmatch "CPU-ASM-EMULATOR version") {
            throw "Packed executable failed the post-pack CLI check."
          }

          Remove-Item -LiteralPath "dist\CPU-ASM-EMULATOR.exe"
          Rename-Item -LiteralPath "dist\CPU-ASM-EMULATOR-upx.exe" -NewName "CPU-ASM-EMULATOR.exe"
          Compress-Archive -Path "dist\CPU-ASM-EMULATOR.exe" -DestinationPath "dist\CPU-ASM-EMULATOR-windows-x64-upx.zip" -Force
          Remove-Item -LiteralPath "dist\CPU-ASM-EMULATOR.exe"

          Get-ChildItem "dist\CPU-ASM-EMULATOR-windows-x64.zip", "dist\CPU-ASM-EMULATOR-windows-x64-upx.zip" |
            Select-Object Name, Length

      - name: Upload standard artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPU-ASM-EMULATOR-windows-x64
          path: dist/CPU-ASM-EMULATOR-windows-x64.zip

      - name: Upload UPX artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPU-ASM-EMULATOR-windows-x64-upx
          path: dist/CPU-ASM-EMULATOR-windows-x64-upx.zip

  linux:
    name: Linux Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke test CLI
        shell: bash
        run: |
          set -euo pipefail
          exe="$PWD/build/CPU-ASM-EMULATOR"

          test -x "$exe"
          "$exe" --help | grep -q "Usage: CPU-ASM-EMULATOR"
          "$exe" --version | grep -q "CPU-ASM-EMULATOR version"

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          cat > "$temp_dir/hello.asm" <<'EOF'
          start:
              %putc r0 72
              %putc r0 105
              %newline r0
              hlt
          EOF

          outbin="$($exe --asm "$temp_dir/hello.asm" --outbin)"
          mapfile -t binary_lines < <(printf '%s\n' "$outbin" | grep -E '^[0-9A-F]{4}: [01]{8}$')
          test "${#binary_lines[@]}" -eq 56
          test "${binary_lines[0]}" = "0000: 00000000"
          test "${binary_lines[7]}" = "0007: 01001000"

          run="$($exe --asm "$temp_dir/hello.asm" --emulate)"
          grep -q "Hi" <<< "$run"

          cat > "$temp_dir/echo.asm" <<'EOF'
          start:
              movi r0, 0
          wait_input:
              in r0
              jz r0, wait_input
              out r0
              hlt
          EOF
          echo_run="$(printf 'Z' | timeout 5 "$exe" --asm "$temp_dir/echo.asm" --emulate)"
          grep -q "Z" <<< "$echo_run"

          cat > "$temp_dir/key.asm" <<'EOF'
          start:
              movi r0, 0
          wait_key:
              inkey r0
              jz r0, wait_key
              out r0
              hlt
          EOF
          key_run="$(printf 'K' | timeout 5 "$exe" --asm "$temp_dir/key.asm" --emulate)"
          grep -q "K" <<< "$key_run"

          cat > "$temp_dir/no-input.asm" <<'EOF'
          start:
              movi r0, 'A'
              in r0
              out r0
              hlt
          EOF
          no_input_run="$(timeout 5 "$exe" --asm "$temp_dir/no-input.asm" --emulate < /dev/null)"
          grep -q "A" <<< "$no_input_run"

          "$exe" --asm "$temp_dir/hello.asm" --bin "$temp_dir/hello.rom"
          test "$(stat -c '%s' "$temp_dir/hello.rom")" -eq 56
          test "$(od -An -tu1 -j7 -N1 "$temp_dir/hello.rom" | tr -d ' ')" -eq 72

          rom_run="$($exe --rom "$temp_dir/hello.rom" --emulate)"
          grep -q "Hi" <<< "$rom_run"

      - name: Package
        run: |
          mkdir -p dist
          tar -C build -czf dist/CPU-ASM-EMULATOR-linux-x64.tar.gz CPU-ASM-EMULATOR

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPU-ASM-EMULATOR-linux-x64
          path: dist/CPU-ASM-EMULATOR-linux-x64.tar.gz

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: CPU-ASM-EMULATOR-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CPU-ASM-EMULATOR-windows-x64.zip
            dist/CPU-ASM-EMULATOR-windows-x64-upx.zip
            dist/CPU-ASM-EMULATOR-linux-x64.tar.gz
